name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate (lint + typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: capsula_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d capsula_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/capsula_ci?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      # FASE 3 BLOCKER: prisma/migrations/ carece de un baseline 0_init porque
      # el schema base fue creado originalmente vía `prisma db push` en la era
      # pre-migrations. Las migraciones actuales son solo deltas y fallan
      # al correr contra una DB vacía (la primera ALTER sobre PurchaseOrder
      # asume que la tabla ya existe).
      #
      # Volver a `prisma migrate deploy` cuando se cree la migración baseline.
      - name: Sync schema to database (CI bypasses migration history)
        run: npx prisma db push --skip-generate --accept-data-loss

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test

  # Deploy al VPS Contabo (kpsula.app).
  #
  # Triggers:
  #   - push a main → auto-deploy tras `validate` verde.
  #   - workflow_dispatch → manual desde la pestaña Actions (rollback, redeploy, etc.).
  #
  # Concurrency: un solo deploy a la vez; si llega otro push, cancela el corriente
  # para evitar swaps atómicos solapados sobre /var/www/capsula-erp.
  #
  # Secrets requeridos en el repo (Settings → Secrets and variables → Actions):
  #   CONTABO_HOST    — IP o hostname del VPS (e.g. 147.93.6.70)
  #   CONTABO_USER    — usuario SSH (root)
  #   CONTABO_SSH_KEY — clave privada SSH ed25519 con acceso a authorized_keys del VPS
  #
  # El deploy ejecuta scripts/deploy-vps.sh VERSIONADO EN EL REPO, descargado en
  # el commit exacto que se está deployando. Flujo seguro:
  #   backup BD → clone fresh → build → prisma migrate deploy → smoke test Prisma
  #   → swap atómico → pm2 restart → verificación.
  # Si una migración o el smoke test fallan, aborta sin tocar la instalación viva.
  #
  # Historial: hasta junio 2026 esto invocaba /root/deploy-capsula.sh — una copia
  # vieja que vivía SOLO en el VPS y NO corría `prisma migrate deploy`. Resultado:
  # cada PR con migración deployaba código que crasheaba contra una BD sin las
  # tablas/columnas nuevas (PRs #233/#234/#291/#294), y había que destrabarlo a
  # mano con apply-migrations.yml. Bajar el script del repo elimina el drift.
  deploy:
    name: Deploy to Contabo VPS
    runs-on: ubuntu-latest
    needs: validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    concurrency:
      group: deploy-contabo-main
      cancel-in-progress: true
    timeout-minutes: 20

    steps:
      # Tanto el script de deploy como el código se SUBEN desde el runner, que
      # ya tiene el repo clonado con credenciales de Actions. Con el repo
      # privado el VPS no tiene forma anónima de traer nada: raw.github
      # devuelve 404 y `git clone` pide una deploy key propia. Mandándole el
      # árbol, el VPS no necesita ninguna credencial de GitHub.
      - name: Checkout (código a deployar)
        uses: actions/checkout@v4

      # .git queda FUERA del paquete a propósito: actions/checkout deja ahí el
      # token de la corrida (http.extraheader) y ese token no debe viajar al
      # VPS. El SHA se pasa aparte, en .deploy-commit.
      - name: Empaquetar código
        run: |
          echo "${{ github.sha }}" > "$GITHUB_WORKSPACE/.deploy-commit"
          tar -czf "$RUNNER_TEMP/capsula-src.tgz" \
            --exclude=.git --exclude=node_modules --exclude=.next \
            -C "$GITHUB_WORKSPACE" .
          cp "$RUNNER_TEMP/capsula-src.tgz" "$GITHUB_WORKSPACE/capsula-src.tgz"
          ls -lh "$GITHUB_WORKSPACE/capsula-src.tgz"

      - name: Subir deploy-vps.sh al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          source: scripts/deploy-vps.sh
          target: /tmp/capsula-deploy-${{ github.sha }}
          strip_components: 1

      - name: Subir código al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          source: capsula-src.tgz
          target: /tmp/capsula-deploy-${{ github.sha }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          script_stop: true
          command_timeout: 15m
          envs: GITHUB_SHA
          script: |
            set -e
            export BUILD_SHA="$GITHUB_SHA"
            export BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)

            # Script y código subidos por los steps anteriores, pinneados al
            # commit que se deploya. Corre desde /tmp (no desde
            # /var/www/capsula-erp) porque el propio script hace swap de ese
            # directorio a mitad de ejecución.
            DEPLOY_DIR="/tmp/capsula-deploy-$GITHUB_SHA"
            DEPLOY_SCRIPT="$DEPLOY_DIR/deploy-vps.sh"
            SRC_TARBALL="$DEPLOY_DIR/capsula-src.tgz"
            test -s "$DEPLOY_SCRIPT" || { echo "ERROR: no llegó $DEPLOY_SCRIPT"; exit 1; }
            test -s "$SRC_TARBALL"   || { echo "ERROR: no llegó $SRC_TARBALL"; exit 1; }

            echo ">>> Ejecutando deploy-vps.sh (SHA: $BUILD_SHA)"
            SRC_TARBALL="$SRC_TARBALL" bash "$DEPLOY_SCRIPT" main
            rm -rf "$DEPLOY_DIR"
            echo ">>> Deploy completado OK"
