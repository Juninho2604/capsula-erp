plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Resueltos ANTES del bloque android: escribir
//   versionCode (findProperty('versionCode') ?: '1').toInteger()
// Groovy lo parsea como versionCode(...).toInteger() — invoca el setter con
// un String y luego llama toInteger() sobre su retorno nulo → el build muere
// con "IllegalArgumentException: Value is null" (falló así el run #2 real).
def appVersionCode = ((project.findProperty('versionCode') ?: '1') as String).toInteger()
def appVersionName = (project.findProperty('versionName') ?: '1.0.0') as String

android {
    namespace 'app.kpsula.local'
    compileSdk 34

    defaultConfig {
        // packageId distinto al TWA (app.kpsula.erp) — pueden convivir.
        applicationId 'app.kpsula.local'
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    // Firma release SOLO si están las CUATRO variables — un signingConfig con
    // algún valor nulo también aborta el build. Sin las cuatro
    // se cae a debug, que se firma con la keystore de debug de Android y se
    // instala igual por sideload — es una app de LAN interna, no va a Play.
    def ksFile = System.getenv('ANDROID_KEYSTORE_FILE')
    def ksPass = System.getenv('ANDROID_KEYSTORE_PASSWORD')
    def ksAlias = System.getenv('ANDROID_KEY_ALIAS')
    def keyPass = System.getenv('ANDROID_KEY_PASSWORD')
    def canSign = ksFile?.trim() && ksPass?.trim() && ksAlias?.trim() && keyPass?.trim()

    signingConfigs {
        release {
            if (canSign) {
                storeFile file(ksFile)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (canSign) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Sin dependencias: WebView + APIs de plataforma alcanzan y el APK queda mínimo.
}
